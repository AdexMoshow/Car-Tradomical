<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="herbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feOffset dx="0" dy="5" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Main Symbol Container -->
  <g filter="url(#softShadow)">
    <!-- Stylized "A" representing a Road (Car) -->
    <path d="M256 80 L120 400 H200 L256 180 L312 400 H392 L256 80 Z" fill="white" />

    <!-- Central Leaf Element (Trado) crossing the "A" -->
    <path d="M160 320 C160 320 256 220 352 320 C352 320 256 420 160 320 Z" fill="url(#herbGrad)" stroke="white" stroke-width="12" />

    <!-- Small Leaf Vein -->
    <path d="M180 320 L332 320" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Glossy Overlay -->
  <path d="M120 0 H392 C458 0 512 54 512 120 V200 C512 200 300 150 0 250 V120 C0 54 54 0 120 0 Z" fill="white" opacity="0.1" />
</svg>
